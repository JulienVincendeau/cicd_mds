[project]
name = "tp-dataops-cicd"
version = "0.1.0"
description = "Fil rouge M2 Data — DataOps & CI/CD sur Google Cloud"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "duckdb>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
lint.select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
